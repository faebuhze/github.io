<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLTAGSSCRIPTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Hide scrollbar while keeping scrolling functional */
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            overflow-y: auto;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: 'Aktiv Grotesk', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }
        
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: white;
            border: 2px solid #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border 0.3s ease, height 0.3s ease;
            overflow: hidden;
        }
        
        .header-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0; /* Kein Padding, damit der Text die Ränder berühren kann */
        }
        
        h1 {
            font-size: 6rem;
            letter-spacing: 127px; /* Initial value, will be adjusted dynamically by JS */
            font-weight: bold;
            -webkit-text-stroke-width: 0.5px;
            -webkit-text-stroke-color: yellow;
            color: rgb(0, 0, 0);
            text-shadow: 0 0 1px yellow;
            white-space: nowrap;
            width: 100%;
            transform-origin: left center;
            position: relative;
            text-align: center;
            /* Initial transform - will be set by JS */
            transform: scaleY(5);
        }
        
        /* Responsive font-size adjustments */
        @media (max-width: 1200px) {
            h1 {
                font-size: 4.5rem;
                /* Entferne feste letter-spacing, wird dynamisch berechnet */
            }
        }
        
        @media (max-width: 900px) {
            h1 {
                font-size: 3.5rem;
                /* Entferne feste letter-spacing, wird dynamisch berechnet */
            }
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
                /* Entferne feste letter-spacing, wird dynamisch berechnet */
            }
        }
        
        @media (max-width: 400px) {
            h1 {
                font-size: 1.5rem;
                /* Entferne feste letter-spacing, wird dynamisch berechnet */
            }
        }
        
        .spacer {
            width: 100%;
            height: 100vh;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Maximum 4 columns */
            gap: 2px;
            margin: -34px auto 0;
            padding: 0 10px;
        }
        
        .video-item {
            aspect-ratio: 9/16;
            border: 1px solid #ccc;
            overflow: hidden;
            position: relative;
            will-change: transform;
            transform: translateZ(0);
            cursor: pointer;
        }
        
        .video-item video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            will-change: opacity;
            transition: opacity 0.3s ease;
            backface-visibility: hidden; /* Performance optimization */
        }

        /* Benutzerdefinierter Cursor - schwarzer Punkt mit gelber Umrandung */
        body, html, * {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" stroke="yellow" stroke-width="2" fill="black" /></svg>') 16 16, auto;
        }

        /* Zeige einen etwas größeren Cursor für interaktive Elemente */
        a, button, input, .video-item {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" stroke="yellow" stroke-width="2" fill="black" /></svg>') 16 16, pointer;
        }
        
        .normal-video {
            opacity: 1;
            z-index: 2;
        }
        
        .ascii-video {
            opacity: 0;
            z-index: 1;
        }
        
        /* Responsive grid adjustments */
        @media (max-width: 1200px) {
            .video-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 900px) {
            .video-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="hide-scrollbar">
    <header id="stickyHeader" style="height: 100vh;">
        <div class="header-content">
            <h1 id="headerText" style="transform: scaleY(5);">ALLTAGSSCRIPTS</h1>
        </div>
    </header>
    
    <div class="spacer" id="headerSpacer" style="height: 100vh;"></div>
    
    <div class="video-container" id="videoGrid">
        <!-- Videos will be dynamically added here -->
    </div>

    <script>
        // Header animation variables
        const header = document.getElementById('stickyHeader');
        const headerText = document.getElementById('headerText');
        const spacer = document.getElementById('headerSpacer');
        
        // Original Text
        const originalText = "ALLTAGSSCRIPTS";
        
        // Header animation constants
        const MIN_HEADER_HEIGHT = 80; // final header height in px
        const INITIAL_HEADER_HEIGHT = window.innerHeight; // full viewport height
        
        // Debounce function for performance optimization
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(context, args);
                }, wait);
            };
        }
        
        // Enhanced function to make text stretch from edge to edge
        function makeTextStretchEdgeToEdge() {
            // Get current viewport width
            const viewportWidth = window.innerWidth;
            
            // Berechne dynamic letter spacing basierend auf Bildschirmbreite
            // Auf 2400+ Pixeln verwenden wir das volle Letter-Spacing von 127px
            // Darunter wird es proportional reduziert
            let letterSpacing;
            if (viewportWidth >= 2400) {
                letterSpacing = 127;
            } else if (viewportWidth <= 400) {
                letterSpacing = 2; // Minimaler Abstand für sehr kleine Bildschirme
            } else {
                // Lineares Mapping zwischen 400px und 2400px Bildschirmbreite
                letterSpacing = 2 + ((viewportWidth - 400) / 2000) * 125;
            }
            
            // Runde auf ganze Zahlen
            letterSpacing = Math.round(letterSpacing);
            
            // Wende letter-spacing an
            headerText.style.letterSpacing = letterSpacing + 'px';
            
            // Berechne tatsächliche Textbreite
            // Temporär Transform entfernen, um korrekte Breite zu messen
            const originalTransform = headerText.style.transform;
            headerText.style.transform = 'none';
            const textWidth = headerText.scrollWidth;
            const containerWidth = header.offsetWidth;
            
            // Bei zu großer Textbreite horizontal skalieren
            let scale = 1;
            if (textWidth > containerWidth) {
                // Erhöhe die Skalierung leicht um 3%, damit das "S" garantiert am Rand ankommt
                scale = (containerWidth / textWidth) * 1.03;
                console.log("Text wird skaliert mit Faktor:", scale);
            }
            
            // Original-Transform wiederherstellen mit angepasster horizontaler Skalierung
            // Extrahiere aktuellen scaleY-Wert
            let currentScaleY = 5; // Default-Wert beim Start
            if (originalTransform) {
                const match = originalTransform.match(/scaleY\(([^)]+)\)/);
                if (match && match[1]) {
                    currentScaleY = parseFloat(match[1]);
                }
            }
            
            // Beide Transformationen kombinieren
            headerText.style.transform = `scaleX(${scale}) scaleY(${currentScaleY})`;
            
            // Speichere die Werte für Animationen
            headerText.dataset.letterSpacing = letterSpacing;
            headerText.dataset.scaleX = scale;
            
            console.log("Bildschirmbreite:", viewportWidth, "Letter-Spacing:", letterSpacing);
            
            return letterSpacing;
        }
        
        // Initialize header size
        function initHeader() {
            // Set initial full-height for header
            header.style.height = INITIAL_HEADER_HEIGHT + 'px';
            spacer.style.height = INITIAL_HEADER_HEIGHT + 'px';
            
            // Wait a moment for fonts to load before calculating
            setTimeout(() => {
                // Calculate the spacing to stretch text edge to edge
                makeTextStretchEdgeToEdge();
                
                // Store natural height of text for calculations
                headerText.style.transform = 'none';
                const naturalHeight = headerText.offsetHeight;
                
                // Calculate how much we need to scale vertically to match screenshot
                const initialScaleY = INITIAL_HEADER_HEIGHT * 1.8 / naturalHeight;
                
                // Store original scale values
                headerText.dataset.initialScaleY = initialScaleY;
                headerText.dataset.finalScaleY = 0.8; // Slightly smaller than normal at the end
                
                // Apply initial vertical stretching - this should make the text tall at start
                const scaleX = parseFloat(headerText.dataset.scaleX || '1');
                headerText.style.transform = `scaleX(${scaleX}) scaleY(${initialScaleY})`;
                
                console.log("Initial stretch applied, scaleY:", initialScaleY, "scaleX:", scaleX);
            }, 100);
        }
        
        // Use requestAnimationFrame for smoother animations
        let lastScrollPos = 0;
        let ticking = false;
        
        // Update header based on scroll position
        function updateHeaderTransform(scrollPos) {
            // Calculate how much to shrink the header (between 0 and 1)
            const shrinkRatio = Math.min(scrollPos / (INITIAL_HEADER_HEIGHT * 0.8), 1);
            
            // Calculate current header height
            const currentHeight = INITIAL_HEADER_HEIGHT - shrinkRatio * (INITIAL_HEADER_HEIGHT - MIN_HEADER_HEIGHT);
            
            // Apply height change
            header.style.height = currentHeight + 'px';
            
            // Get scale values
            const initialScaleY = parseFloat(headerText.dataset.initialScaleY);
            const finalScaleY = parseFloat(headerText.dataset.finalScaleY);
            const scaleX = parseFloat(headerText.dataset.scaleX || '1');
            
            // Calculate current scaleY - starting from very high (stretched) and reducing to normal
            const currentScaleY = initialScaleY - shrinkRatio * (initialScaleY - finalScaleY);
            
            // Apply the transform - maintain the edge-to-edge width scaling with scaleX
            headerText.style.transform = `scaleX(${scaleX}) scaleY(${currentScaleY})`;
            
            // Adjust border width based on shrink ratio
            const borderWidth = 2 - shrinkRatio;
            header.style.borderWidth = borderWidth + 'px';
            
            ticking = false;
        }
        
        // Handle scroll events with requestAnimationFrame
        function handleScroll() {
            lastScrollPos = window.pageYOffset || document.documentElement.scrollTop;
            
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    updateHeaderTransform(lastScrollPos);
                });
                ticking = true;
            }
        }
        
        // Handle window resize with debounce
        const handleResize = debounce(function() {
            // Recalculate the letter spacing on resize
            makeTextStretchEdgeToEdge();
            
            // Recalculate header height constant on resize
            const newInitialHeaderHeight = window.innerHeight;
            // Update spacer height
            spacer.style.height = newInitialHeaderHeight + 'px';
            
            // Update header transform
            handleScroll();
        }, 100);
        
        // Sample video URLs (replace with your actual video URLs)
        const sampleVideos = [
            "IMG_7949.MP4",
            "IMG_7950.MP4",
            "IMG_7951.MP4",
            "IMG_7953.mp4",
            "IMG_7962_2.MP4",
            "IMG_7990.MP4",
            "IMG_7964.mp4"
        ];
        
        // ASCII art versions of the videos
        const asciiVideos = [
            "mouri_ascii.mp4",
            "IMG_7950_ascii.MP4",
            "IMG_7951_ascii.MP4",
            "IMG_7953_ascii_2.mp4",
            "IMG_7962_ascii_2.MP4",
            "IMG_7990_ascii.MP4",
            "IMG_7964_ascii.mp4"
        ];
        
        // Keep track of loaded videos to limit concurrent loading
        let loadedVideos = 0;
        const CONCURRENT_VIDEO_LOAD_LIMIT = 12; // Increased limit for more videos
        
        // Set to track active video elements to manage playback
        const activeVideos = new Set();
        
        // Performance optimizations
        const USE_LOW_QUALITY_FOR_MOBILE = true; // Lower quality on mobile for better performance
        const MOBILE_WIDTH_THRESHOLD = 768; // Screen width threshold for mobile optimizations
        
        // Function to create video elements with hover effect
        function createVideoGrid() {
            const videoGrid = document.getElementById('videoGrid');
            videoGrid.innerHTML = ''; // Clear existing videos if any
            
            // Calculate how many videos to display based on screen size
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            // Determine number of columns based on screen width
            let videosPerRow;
            if (screenWidth <= 600) {
                videosPerRow = 1;
            } else if (screenWidth <= 900) {
                videosPerRow = 2;
            } else if (screenWidth <= 1200) {
                videosPerRow = 3;
            } else {
                videosPerRow = 4; // Maximum 4 columns as requested
            }
            
            // Calculate the number of rows needed to fill the screen plus some extra
            const videoHeight = (screenWidth / videosPerRow) * (16/9); // Approximate height in portrait mode
            const rowsNeeded = Math.ceil((screenHeight * 3) / videoHeight); // Fill 3 screen heights for more videos
            const totalVideos = Math.max(rowsNeeded * videosPerRow, 12); // Ensure at least 12 videos are loaded
            
            // Check if we're on iOS (these settings help ensure autoplay and loop work on iPhone)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
            // Create video elements (only what's needed to fill the screen plus some extra)
            for (let i = 0; i < totalVideos; i++) {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                
                // Create the normal video with iOS-friendly settings
                const normalVideo = document.createElement('video');
                normalVideo.src = sampleVideos[i % sampleVideos.length]; // Cycle through available videos
                normalVideo.className = 'normal-video';
                normalVideo.loop = true;
                normalVideo.muted = true;
                normalVideo.autoplay = false; // Start as false, will be controlled by IntersectionObserver
                normalVideo.playsInline = true;
                normalVideo.setAttribute('playsinline', ''); // Essential for iOS
                normalVideo.setAttribute('webkit-playsinline', ''); // For older iOS
                
                // iOS specific attributes
                if (isIOS) {
                    normalVideo.setAttribute('controls', false); // Hide controls but enable more iOS playback capabilities
                    normalVideo.setAttribute('preload', 'auto');
                }
                
                // Apply proper sizing for performance
                normalVideo.width = 640; // Set a standard size
                normalVideo.height = 1136; // 16:9 ratio for portrait
                
                // Mobile performance optimizations
                if (USE_LOW_QUALITY_FOR_MOBILE && window.innerWidth <= MOBILE_WIDTH_THRESHOLD) {
                    normalVideo.setAttribute('preload', 'metadata');
                    normalVideo.style.objectFit = 'contain'; // Less GPU intensive
                } else {
                    normalVideo.preload = "auto";
                }
                
                // Create the ASCII art version video with similar settings
                const asciiVideo = document.createElement('video');
                asciiVideo.src = asciiVideos[i % asciiVideos.length]; // Cycle through available ASCII videos
                asciiVideo.className = 'ascii-video';
                asciiVideo.loop = true;
                asciiVideo.muted = true;
                asciiVideo.autoplay = false; // Start as false, will be controlled by IntersectionObserver
                asciiVideo.playsInline = true;
                asciiVideo.setAttribute('playsinline', ''); // Essential for iOS
                asciiVideo.setAttribute('webkit-playsinline', ''); // For older iOS
                
                // iOS specific attributes
                if (isIOS) {
                    asciiVideo.setAttribute('controls', false); // Hide controls but enable more iOS playback capabilities
                    asciiVideo.setAttribute('preload', 'auto');
                }
                
                // Apply proper sizing for performance
                asciiVideo.width = 640; // Set a standard size
                asciiVideo.height = 1136; // 16:9 ratio for portrait
                
                // Mobile performance optimizations
                if (USE_LOW_QUALITY_FOR_MOBILE && window.innerWidth <= MOBILE_WIDTH_THRESHOLD) {
                    asciiVideo.setAttribute('preload', 'metadata');
                    asciiVideo.style.objectFit = 'contain'; // Less GPU intensive
                } else {
                    asciiVideo.preload = "auto";
                }
                
                // Add error handling for video loading
                normalVideo.onerror = function() {
                    console.error(`Failed to load normal video: ${this.src}`);
                };
                
                asciiVideo.onerror = function() {
                    console.error(`Failed to load ASCII video: ${this.src}`);
                };
                
                // Ensure videos restart when they end (forcing loop to work on iOS)
                normalVideo.onended = function() {
                    this.currentTime = 0;
                    this.play().catch(e => console.log('Error restarting normal video:', e));
                };
                
                asciiVideo.onended = function() {
                    this.currentTime = 0;
                    this.play().catch(e => console.log('Error restarting ASCII video:', e));
                };
                
                // Add both videos to the container
                videoItem.appendChild(normalVideo);
                videoItem.appendChild(asciiVideo);
                
                // Add hover event listeners with throttling for performance
                let isHovered = false;
                videoItem.addEventListener('mouseenter', function() {
                    if (!isHovered) {
                        isHovered = true;
                        normalVideo.style.opacity = '0';
                        asciiVideo.style.opacity = '1';
                    }
                });
                
                videoItem.addEventListener('mouseleave', function() {
                    if (isHovered) {
                        isHovered = false;
                        normalVideo.style.opacity = '1';
                        asciiVideo.style.opacity = '0';
                    }
                });
                
                // Add touch events for mobile
                videoItem.addEventListener('touchstart', function() {
                    if (!isHovered) {
                        isHovered = true;
                        normalVideo.style.opacity = '0';
                        asciiVideo.style.opacity = '1';
                    } else {
                        isHovered = false;
                        normalVideo.style.opacity = '1';
                        asciiVideo.style.opacity = '0';
                    }
                });
                
                videoGrid.appendChild(videoItem);
                
                // Mark as not loaded yet - will be loaded by Intersection Observer
                normalVideo.dataset.loaded = "false";
                asciiVideo.dataset.loaded = "false";
                
                // Setze preload="none", um zu verhindern, dass der Browser die Videos vorab lädt
                normalVideo.preload = "none";
                asciiVideo.preload = "none";
            }
        }
        
        // Function to start a video pair with synchronization
        function startVideoWithSynchronization(normalVideo, asciiVideo) {
            // Only attempt to load if not already loaded
            if (normalVideo.dataset.loaded === "true") return;
            
            // Mark as loaded
            normalVideo.dataset.loaded = "true";
            asciiVideo.dataset.loaded = "true";
            
            // Track these videos as active
            activeVideos.add(normalVideo);
            activeVideos.add(asciiVideo);
            
            // Lade Video-Inhalte explizit
            normalVideo.load();
            asciiVideo.load();
            
            // For iOS, use a slightly different approach
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS) {
                // For iOS, we need to play as a result of user interaction
                // Then attempt to play them
                playVideoIOSFriendly(normalVideo);
                playVideoIOSFriendly(asciiVideo);
            } else {
                // On other platforms, we can simply play
                Promise.all([
                    normalVideo.play().catch(error => console.log('Normal video play failed:', error)),
                    asciiVideo.play().catch(error => console.log('ASCII video play failed:', error))
                ]);
            }
            
            // Make sure videos remain in sync
            syncVideoPair(normalVideo, asciiVideo);
        }
        
        // Special iOS-friendly play function
        function playVideoIOSFriendly(video) {
            video.play()
                .then(() => {
                    console.log("Video started playing successfully");
                })
                .catch(error => {
                    console.log('Video play failed, retrying with different approach:', error);
                    
                    // If normal play fails, try with user interaction simulation
                    video.setAttribute('autoplay', '');
                    video.load();
                    
                    // Sometimes this helps on iOS
                    setTimeout(() => {
                        video.play()
                            .catch(e => console.log('Final attempt to play video failed:', e));
                    }, 100);
                });
        }
        
        // Function to keep a video pair synchronized
        function syncVideoPair(normalVideo, asciiVideo) {
            // Clear any existing sync interval for this video
            clearInterval(normalVideo.syncInterval);
            
            // Create a new sync interval
            normalVideo.syncInterval = setInterval(() => {
                // Only sync if videos are playing and visible
                if (normalVideo.dataset.visible === "true" && 
                    !normalVideo.paused && !asciiVideo.paused) {
                    
                    // If times are significantly different, sync them
                    if (Math.abs(normalVideo.currentTime - asciiVideo.currentTime) > 0.3) {
                        asciiVideo.currentTime = normalVideo.currentTime;
                    }
                    
                    // If either video has reached the end but hasn't looped, restart it
                    if (normalVideo.currentTime > normalVideo.duration - 0.2) {
                        normalVideo.currentTime = 0;
                    }
                    
                    if (asciiVideo.currentTime > asciiVideo.duration - 0.2) {
                        asciiVideo.currentTime = 0;
                    }
                    
                    // iOS doesn't always respect the loop attribute
                    if (normalVideo.ended) {
                        normalVideo.currentTime = 0;
                        normalVideo.play().catch(e => console.log('Error restarting normal video:', e));
                    }
                    
                    if (asciiVideo.ended) {
                        asciiVideo.currentTime = 0;
                        asciiVideo.play().catch(e => console.log('Error restarting ASCII video:', e));
                    }
                }
            }, 1000); // Check every second
        }

        // Add enhanced lazy loading for videos using Intersection Observer API
        function setupLazyLoading() {
            // Check if IntersectionObserver is supported
            if ('IntersectionObserver' in window) {
                const isMobile = window.innerWidth <= MOBILE_WIDTH_THRESHOLD;
                const observerOptions = {
                    root: null,
                    // Smaller rootMargin on mobile for better performance
                    rootMargin: isMobile ? '100px' : '200px',
                    threshold: 0.1
                };
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        const videoItem = entry.target;
                        const videos = videoItem.querySelectorAll('video');
                        const normalVideo = videos[0];
                        const asciiVideo = videos[1];
                        
                        if (entry.isIntersecting) {
                            // Mark as visible
                            normalVideo.dataset.visible = "true";
                            asciiVideo.dataset.visible = "true";
                            
                            // If not already loaded and we haven't hit our concurrent limit
                            if (normalVideo.dataset.loaded !== "true" && loadedVideos < CONCURRENT_VIDEO_LOAD_LIMIT) {
                                startVideoWithSynchronization(normalVideo, asciiVideo);
                                loadedVideos++;
                            } else if (normalVideo.dataset.loaded === "true") {
                                // If already loaded, just play
                                if (normalVideo.paused) {
                                    normalVideo.play().catch(e => console.log('Error resuming normal video:', e));
                                }
                                if (asciiVideo.paused) {
                                    asciiVideo.play().catch(e => console.log('Error resuming ASCII video:', e));
                                }
                            }
                        } else {
                            // Mark as not visible
                            normalVideo.dataset.visible = "false";
                            asciiVideo.dataset.visible = "false";
                            
                            // Pause when not visible to save resources
                            if (normalVideo.dataset.loaded === "true") {
                                normalVideo.pause();
                                asciiVideo.pause();
                            }
                        }
                    });
                }, observerOptions);
                
                document.querySelectorAll('.video-item').forEach(item => {
                    observer.observe(item);
                });
            } else {
                // Fallback for browsers that don't support IntersectionObserver
                console.log("IntersectionObserver not supported, loading all videos");
                document.querySelectorAll('.video-item').forEach((item, index) => {
                    const videos = item.querySelectorAll('video');
                    if (index < CONCURRENT_VIDEO_LOAD_LIMIT) {
                        startVideoWithSynchronization(videos[0], videos[1]);
                        loadedVideos++;
                    }
                });
            }
        }
        
        // Check video playback state every 5 seconds and ensure looping works
        function setupVideoPlaybackMonitoring() {
            setInterval(() => {
                // Get all visible videos
                const visibleVideos = Array.from(activeVideos).filter(video => 
                    video.dataset.visible === "true" && video.dataset.loaded === "true");
                
                // Make sure they're all playing
                visibleVideos.forEach(video => {
                    if (video.paused || video.ended) {
                        console.log("Restarting paused/ended video");
                        video.currentTime = 0;
                        video.play().catch(e => console.log('Error in playback monitoring:', e));
                    }
                });
            }, 5000);
        }

        // Special iOS document event listeners to help with autoplay
        function setupiOSVideoSupport() {
            if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
                // These events can help trigger playback on iOS
                document.addEventListener('touchstart', initializeVideoPlayback, { once: true });
                document.addEventListener('scroll', initializeVideoPlayback, { once: true });
            }
        }
        
        // Function to help initialize video playback on iOS
        function initializeVideoPlayback() {
            console.log("Initializing video playback from user interaction");
            
            // Get visible videos and try to play them
            document.querySelectorAll('video').forEach(video => {
                if (video.dataset.visible === "true") {
                    video.play().catch(e => console.log('Error in init playback:', e));
                }
            });
        }

        // Initial load
        window.addEventListener('DOMContentLoaded', () => {
            // Header initialisieren - hier passiert der anfängliche Streckeffekt
            initHeader();
            
            // Videos erstellen
            createVideoGrid();
            setupLazyLoading();
            setupVideoPlaybackMonitoring();
            setupiOSVideoSupport();
            
            // Scroll-Event hinzufügen - hierdurch wird der Stretcheffekt beim Scrollen angepasst
            window.addEventListener('scroll', handleScroll);
            
            // Resize-Event hinzufügen
            window.addEventListener('resize', handleResize);
            
            // Text nach einer gewissen Zeit erneut skalieren, um sicherzustellen, dass
            // er korrekt von Rand zu Rand reicht
            setTimeout(makeTextStretchEdgeToEdge, 500);
        });
    </script>
</body>
</html>
